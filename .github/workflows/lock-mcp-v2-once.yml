name: Lock MCP v2 dependency once

on:
  push:
    branches:
      - work/integrity-preflight-v0-1
    paths:
      - "package.json"

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: work/integrity-preflight-v0-1
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Check MCP dependency
        id: check
        shell: bash
        run: |
          node -e "const p=require('./package.json'); process.exit(p.dependencies?.['@modelcontextprotocol/server'] ? 0 : 78)"
        continue-on-error: true
      - name: Update package lock
        if: steps.check.outcome == 'success'
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit package lock
        if: steps.check.outcome == 'success'
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Lock MCP v2 server dependency"
          git push origin HEAD:work/integrity-preflight-v0-1
