name: Repair production runtime dependencies

on:
  push:
    branches:
      - repair/runtime-deps-20260907

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[deps-repair]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: verification-placeholder
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: verification-placeholder
      OPENAI_API_KEY: sk-verification-placeholder
      VERCEL_ENV: preview
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: repair/runtime-deps-20260907

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install current lockfile
        run: npm ci

      - name: Upgrade Next within major
        run: npm install next@16.3.4 --save-exact --package-lock-only

      - name: Refresh compatible production transitives
        run: npm audit fix --omit=dev --package-lock-only

      - name: Reinstall repaired lockfile
        run: |
          rm -rf node_modules
          npm ci

      - name: Verify full repository and runtime audit
        run: npm run build

      - name: Commit verified dependency repair
        run: |
          git config user.name "scanscam-ci"
          git config user.email "actions@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes to commit."
          else
            git commit -m "chore: repair production runtime dependencies [deps-repair]"
            git push origin HEAD:repair/runtime-deps-20260907
          fi
